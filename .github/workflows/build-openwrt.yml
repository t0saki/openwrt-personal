name: Build ImmortalWrt

on:
  push:
    branches: [main]
    paths:
      - build.env
      - configs/**
      - profiles/**
      - patches/**
      - files/**
      - scripts/**
      - .github/workflows/build-openwrt.yml
  workflow_dispatch:
    inputs:
      profiles:
        description: Profiles to build (JSON list, see profiles/)
        default: '["base", "alderlake", "tr3000_v1"]'
      release:
        description: Publish a GitHub release (main only; other branches keep workflow artifacts)
        type: boolean
        default: true

concurrency:
  # A new push supersedes an older push build; manual runs never cancel or
  # get cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Singapore

jobs:
  build:
    name: build (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep the default in sync with PROFILES and make_latest in the release job.
        profile: ${{ fromJSON(inputs.profiles || '["base", "alderlake", "tr3000_v1"]') }}
    env:
      SRC_DIR: ${{ github.workspace }}/immortalwrt
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          # Keep swap: LTO links can exceed the runner's 16 GB of RAM.
          swap-storage: false

      # Shared by compile and collect so a build crossing midnight keeps one name.
      - name: Set image name
        run: echo "BUILD_ID=tosaki-$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Build on the large /mnt disk
        run: |
          mkdir -p "$SRC_DIR"
          if mountpoint -q /mnt; then
            sudo install -d -o "$USER" -g "$(id -gn)" /mnt/immortalwrt
            sudo mount --bind /mnt/immortalwrt "$SRC_DIR"
          fi
          df -h "$SRC_DIR"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      # Bootstraps host Go directly instead of building the go1.4 -> 1.26 chain.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Prepare source
        run: scripts/build.sh prepare

      - name: Configure
        run: GO_BOOTSTRAP_ROOT="$(go env GOROOT)" scripts/build.sh config ${{ matrix.profile }}

      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: immortalwrt/dl
          key: dl-${{ hashFiles('build.env') }}-${{ matrix.profile }}-${{ hashFiles('configs/**', 'profiles/**', 'patches/**') }}
          restore-keys: |
            dl-${{ hashFiles('build.env') }}-${{ matrix.profile }}-
            dl-${{ hashFiles('build.env') }}-

      - name: Download sources
        run: scripts/build.sh download

      - name: Compile
        run: |
          scripts/build.sh compile
          df -h "$SRC_DIR"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.profile }}
          include-hidden-files: true
          path: |
            immortalwrt/logs/
            immortalwrt/.config
          retention-days: 7

      - name: Collect firmware
        run: scripts/build.sh collect ${{ matrix.profile }}

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.profile }}
          path: out/${{ matrix.profile }}/
          retention-days: 7

      # Packages and kmods are only installable on firmware from this very
      # build (custom kernel vermagic, per-build signing key).
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.profile }}
          path: |
            immortalwrt/bin/packages/
            immortalwrt/bin/targets/*/*/packages/
          retention-days: 7

  release:
    needs: build
    # Publish whatever legs succeeded; a failed leg shows up in the notes.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: firmware

      - name: Assemble release
        id: meta
        env:
          PROFILES: ${{ inputs.profiles || '["base", "alderlake", "tr3000_v1"]' }}
        run: |
          [ -n "$(ls firmware 2>/dev/null)" ] || { echo "no firmware was built"; exit 1; }
          . ./build.env

          {
            echo "ImmortalWrt \`$IMMORTALWRT_REF\` from \`${GITHUB_SHA::7}\`, default LAN \`$LAN_IP\`."
            echo
            echo "| profile | fragments | status |"
            echo "|---|---|---|"
            for p in $(jq -r '.[]' <<< "$PROFILES"); do
              # download-artifact flattens a single artifact, so match on a file collect
              # always writes rather than on the directory layout.
              if [ -n "$(find firmware -name "diffconfig_${IMMORTALWRT_REF}_$p" -print -quit)" ]; then
                s=ok
              else
                s=**failed**
              fi
              echo "| $p | $(paste -sd' ' "profiles/$p") | $s |"
            done
            echo
            echo "Third-party packages:"
            echo
            while read -r dir url commit; do
              [ -n "$dir" ] && echo "- [$dir]($url) \`${commit::12}\`"
            done <<< "$THIRD_PARTY"
          } > notes.md
          cat notes.md

          mkdir payload
          find firmware -type f -exec mv -t payload {} +
          (cd payload && sha256sum * > sha256sums.txt)
          # One tag per run, so "Re-run failed jobs" updates the same release.
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Firmware ${{ steps.meta.outputs.date }} (#${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: payload/*
          # A partial run (failed leg or hand-picked profiles) never becomes latest.
          make_latest: ${{ needs.build.result == 'success' && (github.event_name == 'push' || inputs.profiles == '["base", "alderlake", "tr3000_v1"]') }}
