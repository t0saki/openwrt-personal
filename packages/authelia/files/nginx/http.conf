# http{}-level half of the gateway: who may skip Authelia. Per router, so
# copy it and edit:
#   nginx: /etc/nginx/conf.d/authelia-http.conf
#   NPM:   <npm>/data/nginx/custom/http.conf (included at the end of http{})
# Placeholders: 192.168.10.0/24 and 192.168.10.10 (LAN and router address,
# the build.env default), auth.home.example.com.

# Keyed on $realip_remote_addr, the TCP peer before realip rewrites
# $remote_addr: NPM trusts X-Real-IP from any RFC1918 peer, so $remote_addr is
# client-controlled for anything arriving via docker-proxy, SNAT or hairpin.
# Longest prefix wins; IPv6 clients and unparseable values get the default.
geo $realip_remote_addr $authelia_from_lan {
	default			0;
	# Prefer only the ranges real clients get (e.g. the DHCP pool) over the
	# whole subnet.
	192.168.10.0/24		1;
	# Every address that relays traffic from outside is not LAN, or the
	# internet gets in through it unauthenticated. The router itself: frpc,
	# mihomo/OpenClash, tailscale and wireguard masquerade, hairpin NAT and
	# docker-proxy all show up as this address. Never add it, nor 127.0.0.1.
	192.168.10.10		0;
	# Likewise any LAN host with frpc/socks5/ssh tunnels, a Tailscale subnet
	# router or exit node, cloudflared, or an upstream gateway that SNATs
	# port forwards, e.g.:
	# 192.168.10.2		0;
	# Optional static ULA prefix (network.globals.ula_prefix) if LAN clients
	# are steered to it via split DNS, minus the router's own ULA. Never a
	# delegated GUA prefix: it changes under you and would then match someone
	# else.
	# fd00:1234:5678::/64	1;
	# fd00:1234:5678::1	0;
}

# Hosts that never require authentication. The portal must be listed, or the
# redirect to it loops.
map $host $authelia_public_host {
	default			0;
	auth.home.example.com	1;
}

# 1 = skip Authelia. Only "00" (not LAN, not a public host) is checked.
map "$authelia_from_lan$authelia_public_host" $authelia_skip {
	default	1;
	"00"	0;
}

# Password logins (portal.conf): Authelia has no first-factor rate limit and
# each attempt for an existing user is a 64 MiB argon2 hash. All attempts
# share one concurrency cap, which bounds the memory, and each source address
# gets a request rate.
limit_conn_zone $server_name zone=authelia_firstfactor:1m;
limit_req_zone $realip_remote_addr zone=authelia_firstfactor_addr:1m rate=10r/m;
