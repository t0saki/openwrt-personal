# The portal host (auth.home.example.com) itself, proxied to Authelia. It
# must be in $authelia_public_host (http.conf) and use HTTPS (NPM: Force SSL).
#   nginx: include /usr/share/authelia/nginx/portal.conf;  in its server{}
#   NPM:   proxy host auth.home.example.com -> 127.0.0.1:9091, paste into its
#          "Advanced" tab. A "location /" there replaces NPM's default one,
#          whose X-Forwarded-For starts with whatever the client sent.

location / {
	proxy_pass http://127.0.0.1:9091;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-URI $request_uri;
	proxy_set_header X-Forwarded-For $realip_remote_addr;
	proxy_set_header X-Real-IP $realip_remote_addr;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
}

# Password logins and re-authentication (the passkey login under the same
# prefix is cheap but comes along). Regulation only bans after failures are
# recorded, so a burst of parallel attempts would all run argon2 (64 MiB
# each) at once: at most 4 in flight overall, 10/min with a burst of 5 per
# source address (zones in http.conf), 429 beyond that.
location ^~ /api/firstfactor {
	limit_conn authelia_firstfactor 4;
	limit_req zone=authelia_firstfactor_addr burst=5 nodelay;
	limit_conn_status 429;
	limit_req_status 429;

	proxy_pass http://127.0.0.1:9091;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-URI $request_uri;
	proxy_set_header X-Forwarded-For $realip_remote_addr;
	proxy_set_header X-Real-IP $realip_remote_addr;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
}
