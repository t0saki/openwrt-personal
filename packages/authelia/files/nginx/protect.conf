# server{}-level half of the gateway; needs http.conf. Router independent,
# so include it from here and it follows firmware upgrades:
#   nginx: include /usr/share/authelia/nginx/protect.conf;  in each server{}
#   NPM:   copy to <npm>/data/nginx/custom/server_proxy.conf, which NPM
#          includes at the end of every proxy host, so new hosts are
#          protected without a per-host step. Remove per-host Authelia
#          snippets from "Advanced" first: a second auth_request fails nginx -t.
# NPM Streams (TCP/UDP) are not covered. NPM's ACME location sets
# auth_request off already.

location = /internal/authelia/authz {
	internal;
	# LAN clients and public hosts never reach Authelia, so they keep working
	# while it is stopped; everyone else then gets a 500 (fail closed).
	if ($authelia_skip) {
		return 200;
	}
	proxy_pass http://127.0.0.1:9091/api/authz/auth-request;

	proxy_set_header X-Original-Method $request_method;
	# $host has no port: behind a non-443 port use $http_host instead, or
	# the redirect back after login loses it.
	proxy_set_header X-Original-URL $scheme://$host$request_uri;
	# Authelia trusts the leftmost X-Forwarded-For blindly; give it the TCP
	# peer, not a client-supplied header.
	proxy_set_header X-Forwarded-For $realip_remote_addr;
	proxy_set_header Content-Length "";
	proxy_set_header Connection "";
	proxy_pass_request_body off;
	proxy_http_version 1.1;
	proxy_connect_timeout 5s;
	proxy_read_timeout 15s;
}

# Inherited by every location in this server without its own auth_request.
auth_request /internal/authelia/authz;
# Authelia answers 401 with Location set to the portal (from
# session.cookies[].authelia_url plus rd=), so no portal URL is repeated here.
auth_request_set $authelia_redirect $upstream_http_location;
error_page 401 =302 $authelia_redirect;
