# Native nginx example: copy to /etc/nginx/conf.d/gateway.conf, together
# with http.conf as /etc/nginx/conf.d/authelia-http.conf, and edit.
# Listens on 443 only, :80 stays with uhttpd/LuCI. Issue the certificate
# first (luci-app-acme, DNS-01): nginx refuses to start on a missing file.

ssl_certificate /etc/ssl/acme/home.example.com.fullchain.crt;
ssl_certificate_key /etc/ssl/acme/home.example.com.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:1m;
ssl_session_timeout 1h;

map $http_upgrade $connection_upgrade {
	default upgrade;
	"" "";
}

# Unknown names (scanners hitting the bare IP) get no certificate at all.
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	ssl_reject_handshake on;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name auth.home.example.com;
	include /usr/share/authelia/nginx/portal.conf;
}

# One block per service. Backends must not trust Remote-User/Remote-Groups
# headers for login: LAN requests skip Authelia and clients can send them.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name app.home.example.com;
	include /usr/share/authelia/nginx/protect.conf;

	location / {
		proxy_pass http://192.168.10.20:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $realip_remote_addr;
		proxy_set_header X-Real-IP $realip_remote_addr;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}
