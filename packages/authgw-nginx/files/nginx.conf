# Used instead of nginx-ssl-util's UCI template (nginx.global.uci_enable is
# false): that template caps header lines at 1k, which breaks Authelia's rd=
# redirects and larger cookies. There is no server{} here, so nginx listens
# nowhere until a conf.d/*.conf adds one, see /usr/share/authelia/nginx.

user nobody nogroup;
worker_processes auto;

include module.d/*.module;

events {}

http {
	include mime.types;
	default_type application/octet-stream;
	sendfile on;
	server_tokens off;
	access_log off;

	client_max_body_size 128m;
	large_client_header_buffers 4 16k;

	# The compile-time defaults would land in /usr, i.e. on the overlay.
	uwsgi_temp_path /var/lib/nginx/uwsgi;
	scgi_temp_path /var/lib/nginx/scgi;

	include conf.d/*.conf;
}
