# dockerd's 12-br-netfilter-ip.conf turns bridge-nf-call-ip{,6}tables on,
# which sends every frame bridged on br-lan through the IP netfilter hooks
# (fw4, OpenClash, flow offload) whether or not dockerd ever runs. Containers
# here use network_mode: host with "bridge": "none", so nothing needs it.
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-iptables=0
